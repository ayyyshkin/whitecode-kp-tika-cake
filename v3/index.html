<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F7F9">
<meta name="color-scheme" content="light">
<title>Tika Cake · предложение WhiteCode</title>
<meta name="description" content="Интернет-магазин и учёт для Tika Cake: 2 500 000 ₸, 14 недель. Внутри работающее демо.">
<meta property="og:type" content="website">
<meta property="og:title" content="КП для Tika Cake от WhiteCode">
<meta property="og:description" content="Интернет-магазин и учёт: 2 500 000 ₸, 14 недель, 3 платежа. Внутри работающее демо.">
<!-- TODO: og:image 1200×630 -->
<link rel="icon" href="assets/brand/favicon.png">
<link rel="preload" href="assets/fonts/coolvetica-rg.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-var-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/kp.css?v=v3-13">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="#top" data-nav="top" aria-label="WhiteCode, в начало предложения">
    <img class="wm" src="assets/brand/wordmark-black.png" alt="" width="102" height="16">
    <span class="brand-x" aria-hidden="true">×</span><span id="brandClient"></span>
  </a>
  <nav class="topnav" id="topnav" aria-label="Разделы предложения"></nav>
  <a class="btn btn-line btn-sm" href="#request" data-nav="request"><span class="lbl-long">Оставить заявку</span><span class="lbl-short">Заявка</span></a>
</header>

<main>
<section class="hero" id="top">
  <div class="hero-art" id="heroArt" aria-hidden="true"></div>
  <h1 class="hero-title" id="heroTitle"></h1>
  <div class="hero-row">
    <p class="hero-lead" id="heroLead"></p>
    <p class="hero-terms" id="heroTerms"></p>
    <div class="hero-cta">
      <button class="btn btn-accent" type="button" data-demo-start>Пройти демо</button>
      <a class="tlink" href="#request" data-nav="request">Оставить заявку</a>
    </div>
  </div>
  <p class="expired" id="expired" hidden></p>
</section>

<section class="workspace" id="workspace" aria-label="Предложение и демо">
  <aside class="kp" aria-label="Коммерческое предложение">
    <div class="kp-head">
      <p class="kp-where" aria-live="polite"><b id="kpName"></b></p>
      <div class="kp-arrows">
        <button type="button" id="kpUp" aria-label="Предыдущий раздел"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        <button type="button" id="kpDown" aria-label="Следующий раздел"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m6-6-6 6-6-6"/></svg></button>
      </div>
    </div>
    <div class="kp-scroll" id="kpScroll" tabindex="0">
      <div id="kpContent"></div>
    </div>
  </aside>

  <div class="stage" id="stage">
    <p class="now-demo" id="nowDemo"><span>Сейчас в демо</span><b id="nowDemoName">Главная магазина</b></p>
    <div class="laptop" id="laptop">
      <div class="lid">
        <span class="cam" aria-hidden="true"></span>
        <div class="screen">
          <div class="bbar">
            <button type="button" class="bb-btn" data-demo="back" aria-label="Назад в демо"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
            <button type="button" class="bb-btn" data-demo="fwd" aria-label="Вперёд в демо"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
            <div class="addr"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="addr"></span></div>
            <button type="button" class="bb-btn" data-demo="reset" aria-label="Начать показ заново" title="Начать показ заново"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 3.5v5h5"/></svg></button>
            <button type="button" class="bb-btn only-inline" data-demo="full" aria-label="Развернуть демо" title="Развернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            <button type="button" class="bb-close only-overlay" data-demo="close">К предложению</button>
          </div>
          <div class="vp" id="vp">
            <iframe id="demo" title="Демо интернет-магазина и кабинета команды"></iframe>
            <span class="vp-flash" id="vpFlash" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="hinge" aria-hidden="true"></div>
      <div class="deck-wrap" aria-hidden="true"><div class="deck"><div class="keys" id="keys"></div><div class="pad"></div></div></div>
    </div>
    <p class="stage-hint" id="stageHint"><button type="button" data-demo="full">Открыть демо на весь экран</button></p>
  </div>
</section>

<section class="cmini" id="cases" aria-labelledby="casesTitle">
  <div class="cmini-head">
    <h2 id="casesTitle">Похожие проекты</h2>
    <a class="tlink" id="casesAll" target="_blank" rel="noopener">Все кейсы</a>
  </div>
  <ul class="cmini-list" id="caseList"></ul>
</section>

<section class="final" id="request" aria-labelledby="finalTitle">
  <div class="final-left">
    <h2 id="finalTitle" class="rv"></h2>
    <p class="final-text rv" id="finalText"></p>
    <ol class="final-steps" id="finalSteps"></ol>
  </div>
  <form class="req rv" id="reqForm" novalidate>
    <div class="req-mgr">
      <span class="req-ava" id="mgrAva" aria-hidden="true"></span>
      <div><b id="mgrName"></b><span id="mgrRole"></span></div>
    </div>
    <label class="field"><span>Как к вам обращаться</span><input name="name" autocomplete="name" placeholder="Имя"></label>
    <fieldset class="topics">
      <legend>Что обсудим</legend>
      <div class="topic-list" id="topicList"></div>
    </fieldset>
    <details class="wa-preview" id="waBox">
      <summary class="wa-preview-h">Текст сообщения</summary>
      <p id="waPreview" aria-live="polite"></p>
    </details>
    <button class="btn btn-accent btn-block" type="submit"><svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35m-5.42 7.4h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.42Z"/></svg>Оставить заявку</button>
    <p class="req-alt"><a id="mgrPhone"></a><button type="button" class="copy" id="copyPhone">скопировать</button><a id="mgrTg" target="_blank" rel="noopener"></a></p>
  </form>
</section>
</main>

<footer class="foot" id="foot"></footer>

<!-- phone: both actions stay under the thumb -->
<div class="mbar" id="mbar">
  <button type="button" class="btn btn-line" data-demo="open">Открыть демо</button>
  <a class="btn btn-accent" href="#request" data-nav="request">Оставить заявку</a>
</div>

<script src="assets/studio.js?v=v3-13"></script>
<script src="assets/kp-data.js?v=v3-13"></script>
<script src="assets/kp.js?v=v3-13"></script>
</body>
</html>
